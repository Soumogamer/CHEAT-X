<script>

const PID=localStorage.pid||(localStorage.pid=Math.random().toString(36).slice(2,12)+Date.now().toString(36));
let S={me:{av:'c:0',name:''},scr:'splash',tab:0,sel:new Set(),rk:null,ls:[],rank:[],hist:J('h','[]'),L:null,sheet:'',edit:0,chat:0,on:0,rot:0,snd:localStorage.snd!='0',vol:+(localStorage.vol||.5),store:''};

function toast(s){const t=$('#toast');t.textContent=s;t.style.display='block';clearTimeout(t.k);t.k=setTimeout(()=>t.style.display='none',2600)}
/* ---------- sound ---------- */
const ctx=()=>{AC=AC||new(window.AudioContext||window.webkitAudioContext)();if(AC.state=='suspended')AC.resume();return AC};
let MG=null;
function snd(k){if(!S.snd)return;try{ctx();if(!MG){MG=AC.createGain();const c=AC.createDynamicsCompressor();MG.connect(c);c.connect(AC.destination)}
  const t=AC.currentTime,v=S.vol*.6;
  const env=(g,t0,a,d,pk)=>{g.gain.setValueAtTime(.0001,t0);g.gain.exponentialRampToValueAtTime(Math.max(pk,.0002),t0+a);g.gain.exponentialRampToValueAtTime(.0001,t0+a+d)};
  const noise=(d,f,pk,q=.7)=>{const n=AC.sampleRate*d|0,b=AC.createBuffer(1,n,AC.sampleRate),x=b.getChannelData(0);for(let i=0;i<n;i++)x[i]=Math.random()*2-1;
    const s=AC.createBufferSource();s.buffer=b;const fl=AC.createBiquadFilter();fl.type='bandpass';fl.frequency.value=f;fl.Q.value=q;const g=AC.createGain();env(g,t,.004,d,pk*v);s.connect(fl);fl.connect(g);g.connect(MG);s.start(t)};
  const tone=(f,d,pk,dl=0,ty='sine',f2)=>{const o=AC.createOscillator(),g=AC.createGain();o.type=ty;o.frequency.setValueAtTime(f,t+dl);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+dl+d);env(g,t+dl,.01,d,pk*v);o.connect(g);g.connect(MG);o.start(t+dl);o.stop(t+dl+d+.05)};
  ({play:()=>{noise(.09,1500,.9);tone(150,.09,.5,0,'sine',70)},deal:()=>noise(.05,2600,.35),pick:()=>tone(520,.05,.25),turn:()=>{tone(523,.22,.3);tone(659,.28,.3,.12)},
    bluff:()=>{tone(200,.4,.6,0,'sine',70);noise(.12,600,.4)},win:()=>[523,659,784,1047].forEach((f,i)=>tone(f,.4,.3,i*.13,'triangle')),lose:()=>[392,349,294].forEach((f,i)=>tone(f,.35,.28,i*.15))})[k]?.()}catch{}}
/* ---------- connection ---------- */
function conn(){
  ws=new WebSocket((location.protocol=='https:'?'wss://':'ws://')+location.host);
  ws.onopen=()=>{S.on=1;tx({t:'hello',pid:PID,tok:localStorage.tok,acct:J('acct','null'),...J('prof','{}')});RR()};
  ws.onmessage=e=>on(JSON.parse(e.data));

}
const tx=o=>ws&&ws.readyState==1&&ws.send(JSON.stringify(o));
const rect=s=>{const e=$(s);return e&&e.getBoundingClientRect()};
function on(m){const s0=S.scr;switch(m.t){

    const jx=(Math.random()-.5)*26,jy=(Math.random()-.5)*14,r=(Math.random()-.5)*36,ar=o.arc??48,dl=(o.delay||0)+i*(o.gap??70),d=o.d||480;

const sig=(to,data)=>tx({t:'rtc',to,data});

function mic(){

function mk(id,init){const pc=pcs[id]=new RTCPeerConnection({iceServers:ICE});pc.polite=S.L.me>id;pc.t=Date.now();
  pc.onicecandidate=e=>e.candidate&&sig(id,{ice:e.candidate});

  pc.ontrack=e=>{let a=$('#au'+id);if(!a){a=document.createElement('audio');a.id='au'+id;a.autoplay=true;a.playsInline=true;document.body.append(a)}
    const s=e.streams[0]||new MediaStream([e.track]);a.srcObject=s;a.play().catch(()=>{});watch(id,s)};

async function onrtc(from,d){const pc=pcs[from]||mk(from,0);
  try{if(d.sdp){const off=d.sdp.type=='offer',coll=off&&(pc.mkg||pc.signalingState!='stable');pc.ign=!pc.polite&&coll;if(pc.ign)return;
      await pc.setRemoteDescription(d.sdp);if(off){attach(pc);await pc.setLocalDescription();sig(from,{sdp:pc.localDescription})}}
    else if(d.ice){try{await pc.addIceCandidate(d.ice)}catch(e){if(!pc.ign)throw e}}}catch(e){console.log(e)}}

    if(!pc||(pc.connectionState!='connected'&&Date.now()-pc.t>12000)){closePc(p.id);mk(p.id,1)}})}
